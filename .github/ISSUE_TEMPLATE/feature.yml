name: Feature request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? Avoid jumping straight to the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: spec-check
    attributes:
      label: Spec alignment
      description: Per CLAUDE.md §11, features the spec doesn't list go in PRODUCT_SPEC.md "Stretch" first.
      options:
        - label: Already in PRODUCT_SPEC.md, or proposing a spec update first
