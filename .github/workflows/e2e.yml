name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          DATABASE_PATH: /tmp/e2e-test.db
          AUTH_SECRET: e2e-secret-32-chars-min-required-here
          NEXTAUTH_URL: http://localhost:3000
          # AI endpoints return 503 when key is absent — E2E tests don't exercise
          # the AI panel (TC-E2E-06 is deferred; see TEST_CASES.md).
          ANTHROPIC_API_KEY: ""

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_PATH: /tmp/e2e-test.db
          AUTH_SECRET: e2e-secret-32-chars-min-required-here
          NEXTAUTH_URL: http://localhost:3000
          ANTHROPIC_API_KEY: ""

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
