name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Do NOT cancel in-progress deploys — a half-deployed app is worse than
  # a queued one.
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC token exchange with Azure
  contents: read

jobs:
  deploy:
    name: Build & deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Auth secret is only needed at runtime; build-time Next.js modules
          # use process.env.X ?? "" (see lib/auth.ts) to avoid throw-on-missing
          # during `next build` (Next.js build-time env trap — see TUTORIAL.md).
          AUTH_SECRET: build-placeholder
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          DATABASE_PATH: /tmp/build-placeholder.db

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: Configure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "NODE_ENV",      "value": "production",                           "slotSetting": false },
              { "name": "DATABASE_PATH", "value": "${{ vars.DATABASE_PATH }}",            "slotSetting": false },
              { "name": "AUTH_SECRET",   "value": "${{ secrets.AUTH_SECRET }}",           "slotSetting": false },
              { "name": "NEXTAUTH_URL",  "value": "${{ vars.NEXTAUTH_URL }}",             "slotSetting": false },
              { "name": "GOOGLE_CLIENT_ID",     "value": "${{ secrets.GOOGLE_CLIENT_ID }}", "slotSetting": false },
              { "name": "GOOGLE_CLIENT_SECRET", "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}", "slotSetting": false },
              { "name": "AZURE_AD_CLIENT_ID",     "value": "${{ secrets.AZURE_AD_CLIENT_ID }}", "slotSetting": false },
              { "name": "AZURE_AD_CLIENT_SECRET", "value": "${{ secrets.AZURE_AD_CLIENT_SECRET }}", "slotSetting": false },
              { "name": "ANTHROPIC_API_KEY", "value": "${{ secrets.ANTHROPIC_API_KEY }}", "slotSetting": false }
            ]
