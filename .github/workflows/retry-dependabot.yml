name: Retry Dependabot

# pnpm 11 enforces a minimumReleaseAge supply-chain policy. Dependabot bumps
# packages and CI fires immediately — freshly-published packages fail the
# policy on first run. This workflow fires 26 h after midnight UTC, well past
# the 24 h window for any package published the previous day, and re-runs only
# the failed jobs so genuinely-broken PRs are not silently retried to green.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily — 26 h after packages published at ~00:00 UTC
  workflow_dispatch: # allow manual trigger from the GitHub UI

permissions:
  actions: write # needed for reRunWorkflowFailedJobs
  pull-requests: read

jobs:
  retry:
    name: Re-run failed checks on open Dependabot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const botPrs = prs.filter(pr => pr.user.login === 'dependabot[bot]');
            core.info(`Open Dependabot PRs: ${botPrs.length}`);

            for (const pr of botPrs) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: pr.head.sha,
              });

              const failed = data.workflow_runs.filter(r => r.conclusion === 'failure');
              if (failed.length === 0) continue;
              core.info(`PR #${pr.number} "${pr.title}": ${failed.length} failed run(s) — retrying`);

              for (const run of failed) {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.info(`  Re-triggered: ${run.name} (run ${run.id})`);
              }
            }
